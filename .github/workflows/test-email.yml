name: Test email alert

on:
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest

    steps:
      - name: Send test email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          username = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_APP_PASSWORD"]

          msg = EmailMessage()
          msg["From"] = username
          msg["To"] = "cooperfarleymusic@gmail.com"
          msg["Subject"] = "Crypto Opportunity Engine - TEST ALERT"

          msg.set_content("""
          This is a test email from your Crypto Opportunity Engine.

          If you received this, your GitHub email alert system is working.

          Real ENTRY and EXIT alerts will be sent automatically.
          """)

          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as smtp:
              smtp.starttls()
              smtp.login(username, password)
              smtp.send_message(msg)

          print("TEST EMAIL SENT SUCCESSFULLY")
          PY
